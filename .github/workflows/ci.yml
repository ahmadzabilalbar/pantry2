name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & end-to-end test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  secrets:
    name: No secrets in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for credentials
        run: |
          if git grep -nIE '(BEGIN (RSA )?PRIVATE KEY|"private_key"[[:space:]]*:|\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53})' -- \
               ':!README.md' ':!AGENTS.md' ':!.github/*' ':!tools/fake-sheets.mjs' ':!lib/auth.js' ':!tools/hash-password.mjs'; then
            echo "::error::A tracked file appears to contain a private key or password hash."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::An .env file is tracked."
            exit 1
          fi
          echo "No credentials found in tracked files."
